
name: Apply Sapling Android Rebase Overlay

on:
  workflow_dispatch:
    inputs:
      archive_path:
        description: "Modified-files ZIP in repository root"
        required: true
        default: "Sapling-Android-Rebase-Overlay-Modified-Files-Only.zip"
        type: string

permissions:
  contents: write

concurrency:
  group: sapling-android-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-overlay:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate and extract overlay
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
        run: |
          python3 - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["ARCHIVE_PATH"])
          if not archive.is_file():
              raise SystemExit(f"ZIP not found: {archive}")

          root = Path.cwd().resolve()

          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              if not entries:
                  raise SystemExit("ZIP is empty")

              validated = []

              for info in entries:
                  name = info.filename
                  rel = PurePosixPath(name)

                  if not name or "\\" in name or rel.is_absolute():
                      raise SystemExit(f"Unsafe path: {name}")

                  if any(p in ("", ".", "..") for p in rel.parts):
                      raise SystemExit(f"Unsafe path: {name}")

                  if rel.parts[0].lower() == ".git":
                      raise SystemExit(f"Cannot modify .git: {name}")

                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink not allowed: {name}")

                  target = (root / Path(*rel.parts)).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Path escapes repository: {name}")

                  validated.append((info, target))

              count = 0
              for info, target in validated:
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue

                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, target.open("wb") as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
                  count += 1

          print(f"Extracted {count} files.")
          PY

      - name: Review changes
        run: |
          git status --short
          git diff --stat

      - name: Commit source and documentation changes
        env:
          ARCHIVE_PATH: ${{ inputs.archive_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Do not stage workflow files: GITHUB_TOKEN cannot push them.
          git add -A -- . \
            ":(exclude).github/workflows/**" \
            ":(exclude)${ARCHIVE_PATH}"

          if git diff --cached --quiet; then
            echo "No source or documentation changes to commit."
            exit 0
          fi

          echo "========== FILES BEING COMMITTED =========="
          git diff --cached --stat

          git commit -m "Apply Sapling Android rebase overlay"

      - name: Push changes
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Source and documentation changes pushed successfully."
