
name: Sapling Android ARM64 NativeAOT (Vector128)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "global.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: sapling-android-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build UCI for Android ARM64 (automatic SIMD)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Sapling
        uses: actions/checkout@v4

      - name: Install patched .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.114
            11.0.100-rc.3.26522.148
          include-prerelease: true

      - name: Verify SDK versions
        shell: bash
        run: |
          set -euo pipefail

          echo "========== INSTALLED SDKs =========="
          dotnet --list-sdks

          SELECTED="$(dotnet --version)"
          echo "Selected SDK: $SELECTED"

          if [ "$SELECTED" != "11.0.100-rc.3.26522.148" ]; then
            echo "::error::Expected patched .NET 11 RC3 SDK."
            exit 1
          fi

          dotnet --info

      - name: Install native build utilities
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            binutils \
            build-essential \
            zlib1g-dev \
            unzip \
            curl

      - name: Install Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [ ! -x "$TOOLCHAIN/clang" ]; then
            echo "::error::Android NDK Clang compiler not found."
            exit 1
          fi

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "NDK location: $NDK"
          "$TOOLCHAIN/clang" --version

      - name: Verify source and NNUE resources
        shell: bash
        run: |
          set -euo pipefail

          test -f src/Sapling/Sapling.csproj
          test -f src/Sapling.Engine/Sapling.Engine.csproj

          test -s src/Sapling.Engine/Resources/sapling.nnue
          test -s src/Sapling.Engine/Resources/human_policy_v1.weights

          test -f src/Sapling.Engine/EngineCapabilities.cs
          test -f src/Sapling.Engine/Evaluation/NnueRefresh.cs

          echo "Both NNUE resources are present."
          echo "UCI application and engine project are present."

      - name: Verify automatic SIMD configuration
        shell: bash
        run: |
          set -euo pipefail

          dotnet msbuild \
            src/Sapling.Engine/Sapling.Engine.csproj \
            -getProperty:DefineConstants \
            -p:SaplingBackend=Auto > backend-constants.txt

          cat backend-constants.txt

          if grep -q 'SAPLING_SCALAR' backend-constants.txt; then
            echo "::error::Scalar backend is forced. Automatic SIMD is disabled."
            exit 1
          fi

          echo "PASS: automatic SIMD backend is enabled."

      # IMPORTANT:
      # Do not restore Sapling.Engine separately.
      # NativeAOT settings and the Android RID must be applied
      # to the UCI application restore, including its project reference.

      - name: Restore complete Android NativeAOT project
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore src/Sapling/Sapling.csproj \
            --runtime linux-bionic-arm64 \
            --force \
            --no-cache \
            -p:Configuration=Release \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:SelfContained=true \
            -p:DisableUnsupportedError=true \
            -p:SaplingBackend=Auto

      - name: Verify patched compiler and runtime packages
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(".")
          assets_files = list(root.glob("src/**/obj/project.assets.json"))

          if not assets_files:
              raise SystemExit("ERROR: No restored project.assets.json files found.")

          found = set()
          all_compilers = []

          for assets_file in assets_files:
              try:
                  data = json.loads(assets_file.read_text())
              except Exception as exc:
                  raise SystemExit(
                      f"Cannot read {assets_file}: {exc}"
                  )

              for package in data.get("libraries", {}):
                  if "/" not in package:
                      continue

                  package_id, version = package.rsplit("/", 1)
                  package_id = package_id.lower()

                  if package_id == "microsoft.dotnet.ilcompiler":
                      found.add(("ilcompiler", version))
                      all_compilers.append(
                          (assets_file.as_posix(), version)
                      )

                  if package_id == (
                      "microsoft.netcore.app.runtime.nativeaot."
                      "linux-bionic-arm64"
                  ):
                      found.add(("android-runtime-pack", version))

              print(f"Inspected: {assets_file}")

          print("\n========== RESOLVED ILCOMPILER PACKAGES ==========")

          for project, version in all_compilers:
              print(f"{project}: Microsoft.DotNet.ILCompiler {version}")

          required = [
              (
                  "ilcompiler",
                  "10.0.14",
              ),
              (
                  "ilcompiler",
                  "11.0.0-rc.3.26522.148",
              ),
              (
                  "android-runtime-pack",
                  "11.0.0-rc.3.26522.148",
              ),
          ]

          missing = [
              item for item in required if item not in found
          ]

          if missing:
              print("\nERROR: Required patched packages are missing:")

              for item in missing:
                  print(f"  {item[0]}: {item[1]}")

              sys.exit(1)

          vulnerable = []

          for _, version in all_compilers:
              if version in (
                  "10.0.13",
                  "11.0.0-rc.2.26504.105",
              ):
                  vulnerable.append(version)

          if vulnerable:
              raise SystemExit(
                  "ERROR: Vulnerable ILCompiler version detected: "
                  + ", ".join(vulnerable)
              )

          print("\nPASS: Both patched ILCompiler versions are present.")
          print("PASS: Patched Android NativeAOT runtime pack is present.")
          PY

      - name: Publish Sapling UCI for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out
          mkdir -p out

          dotnet publish src/Sapling/Sapling.csproj \
            --configuration Release \
            --runtime linux-bionic-arm64 \
            --self-contained true \
            --no-restore \
            --output out \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:DisableUnsupportedError=true \
            -p:StripSymbols=true \
            -p:SaplingBackend=Auto

          if [ ! -s out/Sapling ]; then
            echo "::error::Sapling executable was not produced."
            exit 1
          fi

          cat > out/ANDROID-ARM64-BUILD-INFO.txt <<'EOF'
          Engine: Sapling
          Target: Android ARM64
          Runtime Identifier: linux-bionic-arm64
          NDK: r27c
          Build: .NET NativeAOT
          .NET 10 SDK: 10.0.114
          .NET 11 SDK: 11.0.100-rc.3.26522.148
          .NET 10 ILCompiler: 10.0.14
          .NET 11 ILCompiler: 11.0.0-rc.3.26522.148
          .NET 11 Android NativeAOT runtime pack: 11.0.0-rc.3.26522.148
          NNUE: Embedded
          Human policy: Embedded
          NNUE backend: Auto
          Expected Android backend: Vector128 / ARM Advanced SIMD
          EOF

          echo "========== PUBLISHED FILES =========="
          find out -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Verify ARM64 executable
        shell: bash
        run: |
          set -euo pipefail

          file out/Sapling

          echo "========== ELF HEADER =========="
          readelf -h out/Sapling

          readelf -h out/Sapling | grep -q AArch64

          echo "========== PROGRAM INTERPRETER =========="
          readelf -l out/Sapling | grep 'Requesting program interpreter' || true

          echo "========== DYNAMIC DEPENDENCIES =========="
          readelf -d out/Sapling | grep NEEDED || true

          echo "========== SHA256 =========="
          sha256sum out/Sapling

          echo "PASS: Android ARM64 executable verified."

      - name: Upload Sapling Android ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sapling-Android-ARM64-Vector128-Auto
          path: out/*
          if-no-files-found: error
          retention-days: 14
