
name: Sapling Android ARM64 NativeAOT (Vector128)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "global.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: sapling-android-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build UCI for Android ARM64 (automatic SIMD)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Sapling
        uses: actions/checkout@v4

      - name: Install patched .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.114
            11.0.100-rc.3.26522.148
          include-prerelease: true

      - name: Verify SDK versions
        shell: bash
        run: |
          set -euo pipefail

          echo "========== INSTALLED SDKs =========="
          dotnet --list-sdks

          SELECTED="$(dotnet --version)"
          echo "Selected SDK: $SELECTED"

          if [ "$SELECTED" != "11.0.100-rc.3.26522.148" ]; then
            echo "::error::Expected .NET 11 RC3 SDK."
            exit 1
          fi

          dotnet --info

      - name: Install native build utilities
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            lld llvm binutils \
            build-essential zlib1g-dev unzip curl

      - name: Install Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$TOOLCHAIN"
          test -x "$TOOLCHAIN/clang"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "NDK: $NDK"
          "$TOOLCHAIN/clang" --version

      - name: Verify UCI source and NNUE resources
        shell: bash
        run: |
          set -euo pipefail

          test -f src/Sapling/Sapling.csproj
          test -f src/Sapling.Engine/Sapling.Engine.csproj

          test -s src/Sapling.Engine/Resources/sapling.nnue
          test -s src/Sapling.Engine/Resources/human_policy_v1.weights

          test -f src/Sapling.Engine/EngineCapabilities.cs
          test -f src/Sapling.Engine/Evaluation/NnueRefresh.cs

          grep -q 'Vector128.IsHardwareAccelerated' \
            src/Sapling.Engine/EngineCapabilities.cs

          grep -q 'UseVector128Nnue' \
            src/Sapling.Engine/Evaluation/NnueRefresh.cs

          echo "PASS: UCI project and NNUE resources found."

      - name: Verify automatic SIMD backend
        shell: bash
        run: |
          set -euo pipefail

          dotnet msbuild \
            src/Sapling.Engine/Sapling.Engine.csproj \
            -getProperty:DefineConstants \
            -p:SaplingBackend=Auto > backend-constants.txt

          cat backend-constants.txt

          if grep -q 'SAPLING_SCALAR' backend-constants.txt; then
            echo "::error::Scalar backend is forced."
            exit 1
          fi

          echo "PASS: Automatic Vector128 backend enabled."

      - name: Configure patched Android NativeAOT runtime pack
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          project = Path("src/Sapling/Sapling.csproj")

          package_id = (
              "Microsoft.NETCore.App.Runtime.NativeAOT."
              "linux-bionic-arm64"
          )

          version = "11.0.0-rc.3.26522.148"

          parser = ET.XMLParser()
          tree = ET.parse(project, parser=parser)
          root = tree.getroot()

          # Find an existing PackageDownload entry.
          existing = None

          for item in root.iter():
              if item.tag.split("}")[-1] == "PackageDownload":
                  if item.attrib.get("Include", "").lower() == package_id.lower():
                      existing = item
                      break

          if existing is None:
              group = ET.SubElement(root, "ItemGroup")
              existing = ET.SubElement(
                  group,
                  "PackageDownload",
                  {
                      "Include": package_id,
                      "Version": f"[{version}]"
                  }
              )
              print("Added patched Android NativeAOT runtime-pack request.")
          else:
              existing.set("Version", f"[{version}]")
              print("Updated Android NativeAOT runtime-pack request.")

          tree.write(
              project,
              encoding="utf-8",
              xml_declaration=True
          )

          print(f"Package: {package_id}")
          print(f"Version: {version}")
          PY

          echo "========== UPDATED PROJECT ENTRY =========="
          grep -n -A3 -B2 \
            'Microsoft.NETCore.App.Runtime.NativeAOT.linux-bionic-arm64' \
            src/Sapling/Sapling.csproj

      - name: Verify NativeAOT package request
        shell: bash
        run: |
          set -euo pipefail

          dotnet msbuild src/Sapling/Sapling.csproj \
            -getItem:PackageDownload > package-download-items.json

          cat package-download-items.json

          grep -qi \
            'Microsoft.NETCore.App.Runtime.NativeAOT.linux-bionic-arm64' \
            package-download-items.json

          grep -q \
            '11.0.0-rc.3.26522.148' \
            package-download-items.json

          echo "PASS: Correct patched runtime-pack request."

      - name: Restore Sapling Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore src/Sapling/Sapling.csproj \
            --runtime linux-bionic-arm64 \
            --force \
            --no-cache \
            -p:Configuration=Release \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:SelfContained=true \
            -p:DisableUnsupportedError=true \
            -p:SaplingBackend=Auto

      - name: Verify restored NativeAOT packages
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          expected_compilers = {
              "10.0.14",
              "11.0.0-rc.3.26522.148",
          }

          runtime_package = (
              "Microsoft.NETCore.App.Runtime.NativeAOT."
              "linux-bionic-arm64"
          ).lower()

          runtime_version = "11.0.0-rc.3.26522.148"

          assets_files = list(Path("src").glob("**/obj/project.assets.json"))

          if not assets_files:
              raise SystemExit("ERROR: No project.assets.json files found.")

          compilers = set()
          runtime_found = False

          for assets_file in assets_files:
              data = json.loads(assets_file.read_text(encoding="utf-8"))

              print(f"\nInspecting: {assets_file}")

              # Regular resolved NuGet packages.
              for package in data.get("libraries", {}):
                  if "/" not in package:
                      continue

                  package_id, version = package.rsplit("/", 1)

                  if package_id.lower() == "microsoft.dotnet.ilcompiler":
                      compilers.add(version)
                      print(f"ILCompiler: {version}")

                  if (
                      package_id.lower() == runtime_package
                      and version == runtime_version
                  ):
                      runtime_found = True
                      print(f"Runtime pack library: {package}")

              # PackageDownload entries are separate from libraries.
              frameworks = (
                  data.get("project", {}).get("frameworks", {})
              )

              for framework_name, framework in frameworks.items():
                  for dependency in framework.get("downloadDependencies", []):
                      name = dependency.get("name", "").lower()
                      version = dependency.get("version", "")

                      if name == runtime_package:
                          print(
                              f"Runtime download dependency "
                              f"({framework_name}): {name} {version}"
                          )

                          normalized = version.strip("[]() ")

                          if runtime_version in normalized:
                              runtime_found = True

          print("\n========== VALIDATION ==========")

          missing = expected_compilers - compilers

          if missing:
              for version in sorted(missing):
                  print(f"ERROR: Missing ILCompiler {version}")
              sys.exit(1)

          print("PASS: ILCompiler 10.0.14")
          print("PASS: ILCompiler 11.0.0-rc.3.26522.148")

          if not runtime_found:
              print(
                  "ERROR: Correct Android NativeAOT runtime pack "
                  "was not found in restore metadata."
              )
              sys.exit(1)

          cache_root = Path(
              os.environ.get(
                  "NUGET_PACKAGES",
                  str(Path.home() / ".nuget" / "packages")
              )
          )

          package_folder = cache_root / runtime_package
          version_folder = package_folder / runtime_version.lower()

          if not version_folder.is_dir():
              print(f"ERROR: Runtime pack cache missing: {version_folder}")

              if package_folder.is_dir():
                  print("Available versions:")
                  for item in package_folder.iterdir():
                      print(f"  {item.name}")

              sys.exit(1)

          if not list(version_folder.glob("*.nuspec")):
              raise SystemExit("ERROR: Runtime pack has no .nuspec file.")

          print(f"PASS: {runtime_package}")
          print(f"PASS: Runtime pack version {runtime_version}")
          print(f"PASS: NuGet cache {version_folder}")

          print("\nALL PATCHED PACKAGES VERIFIED.")
          PY

      - name: Publish Sapling UCI for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out
          mkdir -p out

          dotnet publish src/Sapling/Sapling.csproj \
            --configuration Release \
            --runtime linux-bionic-arm64 \
            --self-contained true \
            --no-restore \
            --output out \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:DisableUnsupportedError=true \
            -p:StripSymbols=true \
            -p:SaplingBackend=Auto \
            -p:NoWarn=IL2026%3BIL3050%3BIL3000

          test -s out/Sapling

          cat > out/ANDROID-ARM64-BUILD-INFO.txt <<'EOF'
          Engine: Sapling
          Target: Android ARM64
          Runtime Identifier: linux-bionic-arm64
          NDK: r27c
          Build: .NET NativeAOT
          .NET 10 SDK: 10.0.114
          .NET 11 SDK: 11.0.100-rc.3.26522.148
          .NET 10 ILCompiler: 10.0.14
          .NET 11 ILCompiler: 11.0.0-rc.3.26522.148
          Android NativeAOT runtime pack: 11.0.0-rc.3.26522.148
          NNUE: Embedded
          Human policy: Embedded
          Backend: Auto
          Expected Android backend: Vector128 / ARM Advanced SIMD
          EOF

          echo "========== PUBLISHED FILES =========="
          find out -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Verify ARM64 executable
        shell: bash
        run: |
          set -euo pipefail

          file out/Sapling

          echo "========== ELF HEADER =========="
          readelf -h out/Sapling

          readelf -h out/Sapling | grep -q AArch64

          echo "========== PROGRAM INTERPRETER =========="
          readelf -l out/Sapling | grep 'Requesting program interpreter' || true

          echo "========== DYNAMIC DEPENDENCIES =========="
          readelf -d out/Sapling | grep NEEDED || true

          echo "========== SHA256 =========="
          sha256sum out/Sapling

          echo "PASS: Android ARM64 executable verified."

      - name: Upload Sapling Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Sapling-Android-ARM64-Vector128-Auto
          path: out/*
          if-no-files-found: error
          retention-days: 14
