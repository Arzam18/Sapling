
name: Sapling Android ARM64 NativeAOT (Vector128)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "global.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Sapling UCI for Android ARM64 (automatic SIMD)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Sapling
        uses: actions/checkout@v4

      - name: Set up patched .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.114
            11.0.100-rc.3.26522.148
          include-prerelease: true

      - name: Verify patched .NET SDK selection
        shell: bash
        run: |
          set -euo pipefail

          echo "========== INSTALLED .NET SDKs =========="
          dotnet --list-sdks

          SELECTED="$(dotnet --version)"
          echo "Selected SDK: $SELECTED"

          if [ "$SELECTED" != "11.0.100-rc.3.26522.148" ]; then
            echo "::error::Expected patched .NET 11 RC3 SDK."
            exit 1
          fi

          dotnet --info

      - name: Install build utilities
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            lld llvm binutils \
            build-essential zlib1g-dev unzip curl

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "$TOOLCHAIN"
          test -x "$TOOLCHAIN/clang"

          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

          echo "NDK: $NDK"
          "$TOOLCHAIN/clang" --version

      - name: Verify current CLI and NNUE resources
        shell: bash
        run: |
          set -euo pipefail

          test -f src/Sapling/Sapling.csproj
          test -f src/Sapling.Engine/Sapling.Engine.csproj

          test -s src/Sapling.Engine/Resources/sapling.nnue
          test -s src/Sapling.Engine/Resources/human_policy_v1.weights

          grep -q 'Vector128.IsHardwareAccelerated' \
            src/Sapling.Engine/EngineCapabilities.cs

          grep -q 'UseVector128Nnue' \
            src/Sapling.Engine/Evaluation/NnueRefresh.cs

          echo "Publishing the updated UCI CLI, not the MAUI application."
          echo "Sapling version:"
          dotnet msbuild src/Sapling/Sapling.csproj \
            -getProperty:Version

          echo "Android compiler:"
          clang --version

      - name: Verify automatic SIMD backend is enabled
        shell: bash
        run: |
          set -euo pipefail

          dotnet msbuild src/Sapling.Engine/Sapling.Engine.csproj \
            -getProperty:DefineConstants \
            -p:SaplingBackend=Auto > backend-constants.txt

          cat backend-constants.txt

          if grep -q 'SAPLING_SCALAR' backend-constants.txt; then
            echo "::error::SAPLING_SCALAR is defined. Android NEON would be disabled."
            exit 1
          fi

          echo "PASS: automatic Vector128 backend remains enabled."

      - name: Verify patched .NET 10 compiler pack availability
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking patched .NET 10 ILCompiler package."

          dotnet restore src/Sapling.Engine/Sapling.Engine.csproj \
            --force \
            --no-cache \
            -p:Configuration=Release \
            -p:SaplingBackend=Auto

          ILCC="$HOME/.nuget/packages/microsoft.dotnet.ilcompiler/10.0.14"

          if [ ! -d "$ILCC" ]; then
            echo "::error::Patched Microsoft.DotNet.ILCompiler 10.0.14 was not restored."
            find "$HOME/.nuget/packages/microsoft.dotnet.ilcompiler" \
              -maxdepth 2 -type d -print 2>/dev/null || true
            exit 1
          fi

          echo "PASS: Microsoft.DotNet.ILCompiler 10.0.14 is present."

      - name: Inject patched Android NativeAOT runtime-pack request
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          project = Path("src/Sapling/Sapling.csproj")
          content = project.read_text(encoding="utf-8-sig")

          package_id = "Microsoft.NETCore.App.Runtime.NativeAOT.linux-bionic-arm64"
          patched_version = "11.0.0-rc.3.26522.148"

          if package_id in content:
              import re

              pattern = (
                  r'(<PackageDownload\s+'
                  r'Include="Microsoft\.NETCore\.App\.Runtime\.NativeAOT\.linux-bionic-arm64"\s+'
                  r'Version=")\[[^"]+\](")'
              )

              updated, count = re.subn(
                  pattern,
                  rf'\g<1>[{patched_version}]\2',
                  content
              )

              if count:
                  content = updated
                  project.write_text(content, encoding="utf-8-sig")
                  print("Updated existing NativeAOT runtime-pack request.")
              elif f'Version="[{patched_version}]"' not in content:
                  raise SystemExit(
                      "Existing NativeAOT PackageDownload entry was found, "
                      "but its version could not be safely updated. "
                      "Inspect Sapling.csproj manually."
                  )
              else:
                  print("Patched NativeAOT runtime-pack request already exists.")
          else:
              item_group = f"""
            <ItemGroup>
              <PackageDownload
                Include="{package_id}"
                Version="[{patched_version}]" />
            </ItemGroup>
          """

              if "</Project>" not in content:
                  raise SystemExit("Could not find closing Project element.")

              content = content.replace(
                  "</Project>",
                  item_group + "\n</Project>",
                  1
              )

              project.write_text(content, encoding="utf-8-sig")
              print("Added patched linux-bionic-arm64 runtime-pack request.")
          PY

      - name: Verify evaluated NativeAOT package request
        shell: bash
        run: |
          set -euo pipefail

          dotnet msbuild src/Sapling/Sapling.csproj \
            -getItem:PackageDownload > package-download-items.json

          cat package-download-items.json

          grep -qi \
            'Microsoft.NETCore.App.Runtime.NativeAOT.linux-bionic-arm64' \
            package-download-items.json

          grep -q \
            '11.0.0-rc.3.26522.148' \
            package-download-items.json

          echo "PASS: patched Android NativeAOT runtime pack requested."

      - name: Restore Sapling Android ARM64 with automatic SIMD
        shell: bash
        run: |
          set -euo pipefail

          dotnet restore src/Sapling/Sapling.csproj \
            --runtime linux-bionic-arm64 \
            --force \
            --no-cache \
            -p:Configuration=Release \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:SelfContained=true \
            -p:DisableUnsupportedError=true \
            -p:SaplingBackend=Auto

      - name: Verify patched NativeAOT packages
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME_PACK="$HOME/.nuget/packages/microsoft.netcore.app.runtime.nativeaot.linux-bionic-arm64/11.0.0-rc.3.26522.148"
          ILC10="$HOME/.nuget/packages/microsoft.dotnet.ilcompiler/10.0.14"

          if [ ! -d "$RUNTIME_PACK" ]; then
            echo "::error::Patched Android NativeAOT runtime pack was not downloaded."
            find "$HOME/.nuget/packages" \
              -maxdepth 2 -type d -iname '*nativeaot*' -print || true
            exit 1
          fi

          if [ ! -d "$ILC10" ]; then
            echo "::error::Patched .NET 10 ILCompiler package is missing."
            exit 1
          fi

          echo "Android runtime pack:"
          find "$RUNTIME_PACK" -maxdepth 3 -type f | head -100

          echo "Patched .NET 10 ILCompiler:"
          find "$ILC10" -maxdepth 2 -type f | head -30

          echo "PASS: patched NativeAOT packages are available."

      - name: Publish Sapling UCI executable (ARM64 Vector128 auto)
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out
          mkdir -p out

          dotnet publish src/Sapling/Sapling.csproj \
            --configuration Release \
            --runtime linux-bionic-arm64 \
            --self-contained true \
            --no-restore \
            --output out \
            -p:PublishAot=true \
            -p:PublishAotUsingRuntimePack=true \
            -p:DisableUnsupportedError=true \
            -p:StripSymbols=true \
            -p:SaplingBackend=Auto \
            -p:NoWarn=IL2026%3BIL3050%3BIL3000

          test -s out/Sapling

          cat > out/ANDROID-ARM64-BUILD-INFO.txt <<'EOF'
          Engine: Sapling
          Source: Updated Sapling source with Android NativeAOT support
          RID: linux-bionic-arm64
          NDK: r27c
          Publish: .NET NativeAOT, self-contained
          .NET 10 SDK: 10.0.114
          .NET 11 SDK: 11.0.100-rc.3.26522.148
          .NET 10 ILCompiler: 10.0.14
          .NET 11 NativeAOT runtime pack: 11.0.0-rc.3.26522.148
          Build backend: Auto (SAPLING_SCALAR is NOT defined)
          Expected Galaxy A16 backend: Vector128 (.NET ARM64 AdvSIMD/NEON)
          Runtime override: SAPLING_BACKEND=Vector128 (assert NEON)
          Runtime override: SAPLING_BACKEND=Scalar (A/B reference)
          NNUE and human policy: Embedded resources from Sapling.Engine
          EOF

          echo "Published files:"
          find out -maxdepth 2 -type f -exec ls -lh {} \;

      - name: Verify Android ARM64 executable
        shell: bash
        run: |
          set -euo pipefail

          file out/Sapling

          readelf -h out/Sapling | grep -E 'Class:|Machine:'
          readelf -h out/Sapling | grep -q AArch64

          echo "Program interpreter:"
          readelf -l out/Sapling | grep 'Requesting program interpreter' || true

          echo "Dynamic dependencies:"
          readelf -d out/Sapling | grep NEEDED || true

          echo "SHA-256:"
          sha256sum out/Sapling

      - name: Upload Sapling Android ARM64
        uses: actions/upload-artifact@v4
        with:
          name: Sapling-Android-ARM64-Vector128-Auto
          path: out/*
          if-no-files-found: error
          retention-days: 14
